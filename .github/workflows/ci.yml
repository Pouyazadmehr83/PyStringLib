name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    name: ${{ matrix.os }} - C++${{ matrix.std }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        std: [17, 20]
        compiler: [gcc, clang, msvc]
        exclude:
          - os: macos-latest
            compiler: gcc
          - os: macos-latest
            compiler: msvc
          - os: windows-latest
            compiler: gcc
          - os: windows-latest
            compiler: clang
          - os: ubuntu-latest
            compiler: msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Single-Header Freshness
        shell: bash
        run: |
          python scripts/amalgamate.py
          git diff --exit-code single_include/pystring.hpp || (echo "single_include/pystring.hpp is out of date! Run python scripts/amalgamate.py" && exit 1)

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_CXX_STANDARD=${{ matrix.std }} -DPYSTRING_BUILD_TESTS=ON -DPYSTRING_BUILD_EXAMPLES=ON

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run Tests
        run: |
          ctest --test-dir build --output-on-failure -C Release
